name: Publicar vista previa Android

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: alabanza-preview-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar rama de desarrollo
        uses: actions/checkout@v4
        with:
          repository: joshuagg86/alabanza
          ref: feature/android-blue-app
          persist-credentials: false
          sparse-checkout: |
            /*
          sparse-checkout-cone-mode: false

      - name: Preparar archivos públicos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public
          find . -maxdepth 1 -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.json' -o -name '*.png' -o -name '*.svg' -o -name '*.webp' -o -name '*.ico' \) -exec cp {} public/ \;
          # Los pads se integrarán al pasar a descargas locales; esta publicación valida la interfaz.
          touch public/.nojekyll
          test -f public/index.html
          test -f public/app-mobile-shell.js

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio a GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
