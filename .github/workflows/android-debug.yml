name: Compilar APK Android de prueba

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-debug.yml'

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Descargar código Android
        uses: actions/checkout@v4
        with:
          repository: joshuagg86/alabanza
          ref: feature/android-blue-app
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar SDK Android
        uses: android-actions/setup-android@v4

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Empaquetar interfaz para Android
        run: npm run build

      - name: Generar proyecto nativo
        run: |
          npx cap add android
          npx cap sync android

      - name: Compilar APK debug
        working-directory: android
        run: bash ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Subir APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: alabanza-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
